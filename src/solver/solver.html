<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>웹 코더</title>
        <link rel="stylesheet" href="solver.css" />
    </head>
    <body>
        <div id="app">
            <header class="topbar">
                <div class="topbar-title">
                    <span class="brand" aria-hidden="true">WC</span>
                    <a
                        id="problem-link"
                        class="problem-id"
                        target="_blank"
                        rel="noopener noreferrer"
                    ></a>
                    <span id="problem-title" class="problem-title"></span>
                    <span id="problem-limits" class="limits"></span>
                </div>

                <div class="topbar-actions">
                    <select id="language" class="select" aria-label="언어"></select>
                    <button
                        id="run"
                        class="btn btn-primary"
                        type="button"
                        title="예제 실행 (Ctrl+Enter)"
                    >
                        <span aria-hidden="true">▶</span> 실행 <kbd>Ctrl ↵</kbd>
                    </button>
                    <button id="stop" class="btn btn-danger-soft" type="button" hidden>
                        <span aria-hidden="true">■</span> 중단
                    </button>
                    <span class="divider" aria-hidden="true"></span>
                    <div class="anchor">
                        <button
                            id="submit"
                            class="btn btn-submit"
                            type="button"
                            title="BOJ에 제출 (Ctrl+Shift+Enter)"
                        >
                            제출
                        </button>
                        <div
                            id="confirm"
                            class="popover"
                            role="dialog"
                            aria-labelledby="confirm-text"
                            hidden
                        >
                            <p id="confirm-text"></p>
                            <div class="popover-actions">
                                <button id="confirm-cancel" class="btn" type="button">취소</button>
                                <button id="confirm-ok" class="btn btn-submit" type="button">
                                    그래도 제출
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="anchor">
                        <button
                            id="more"
                            class="btn btn-icon"
                            type="button"
                            aria-haspopup="menu"
                            aria-expanded="false"
                            title="더 보기"
                        >
                            ⋯
                        </button>
                        <div id="menu" class="menu" role="menu" hidden>
                            <label class="menu-row">
                                <span>소스 코드 공개</span>
                                <select id="code-open" class="select select-sm"></select>
                            </label>
                            <button id="reset" class="menu-item" type="button" role="menuitem">
                                템플릿으로 초기화
                            </button>
                            <div class="menu-hint">
                                <div><kbd>Ctrl ↵</kbd> 실행</div>
                                <div><kbd>Ctrl Shift ↵</kbd> 제출</div>
                            </div>
                        </div>
                    </div>
                    <button id="close" class="btn btn-icon" type="button" title="BOJ 기본 화면으로">
                        ✕
                    </button>
                </div>
            </header>

            <main id="panes">
                <section id="problem-pane" class="pane" aria-label="문제"></section>
                <div
                    id="gutter-problem"
                    class="gutter"
                    role="separator"
                    aria-orientation="vertical"
                    aria-label="문제 패널 너비"
                    tabindex="0"
                ></div>
                <section id="editor-pane" class="pane" aria-label="코드">
                    <div id="editor"></div>
                </section>
                <div
                    id="gutter-results"
                    class="gutter"
                    role="separator"
                    aria-orientation="vertical"
                    aria-label="결과 패널 너비"
                    tabindex="0"
                ></div>
                <section id="results-pane" class="pane" aria-label="실행 결과">
                    <div class="results-head">
                        <div id="status" class="status" aria-live="polite"></div>
                        <button id="add-test" class="btn btn-ghost btn-sm" type="button">
                            + 테스트
                        </button>
                    </div>
                    <div id="compile-box" class="compile-box" hidden></div>
                    <div id="test-list" class="test-list"></div>
                </section>
            </main>
        </div>
        <div id="toast" class="toast" role="status"></div>
        <script src="solver.js"></script>
    </body>
</html>
